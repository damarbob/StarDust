name: Smoke Suite

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  static-analysis:
    name: PHPStan (level 8, no DB)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_mysql
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php8.4-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-php8.4-composer-

      - name: Composer install
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  markdown-lint:
    name: markdownlint (no DB)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Pinned: a floating version can turn CI red on an unrelated day when
      # markdownlint adds or tightens a rule. Rule config lives in
      # .markdownlint.json. The globs cover every tracked markdown file and
      # deliberately exclude vendor/.
      - name: Run markdownlint
        run: npx --yes markdownlint-cli2@0.23.2 "*.md" "src/**/*.md" ".agent/**/*.md" "docs/**/*.md"

  mysql-smoke:
    name: Smoke against MySQL 8.0 on PHP ${{ matrix.php-version }} (must pass)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.1", "8.2", "8.3", "8.4"]

    # One cell per engine collects coverage; Coveralls merges it with the
    # mariadb-smoke upload, so the MariaDB-only Dialect branches count.
    env:
      COVERAGE: ${{ matrix.php-version == '8.4' && 'pcov' || 'none' }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: stardust_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, pdo_mysql
          coverage: ${{ env.COVERAGE }}

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php${{ matrix.php-version }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php-version }}-composer-

      - name: Composer install
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent; then
              echo "MySQL is up"; exit 0
            fi
            sleep 1
          done
          echo "MySQL did not become ready in time"; exit 1

      - name: Run smoke suite
        env:
          STARDUST_TEST_DSN: "mysql:host=127.0.0.1;port=3306;dbname=stardust_test"
          STARDUST_TEST_USER: "root"
          STARDUST_TEST_PASS: "root"
        run: |
          if [ "$COVERAGE" = "pcov" ]; then
            vendor/bin/phpunit --testsuite Smoke --coverage-clover build/clover.xml
          else
            vendor/bin/phpunit --testsuite Smoke
          fi

      # Never fails the job: a Coveralls outage must not turn a green
      # suite red. Coverage is reported, not gated.
      - name: Upload coverage
        if: env.COVERAGE == 'pcov'
        uses: coverallsapp/github-action@v2
        with:
          file: build/clover.xml
          format: clover
          flag-name: mysql
          parallel: true
          fail-on-error: false

  mariadb-smoke:
    name: Smoke against MariaDB ${{ matrix.mariadb-version }} on PHP ${{ matrix.php-version }} (must pass)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.1", "8.2", "8.3", "8.4"]
        mariadb-version: ["10.11", "11"]

    # Pairs with mysql-smoke's coverage cell; 10.11 because it is the floor.
    env:
      COVERAGE: ${{ (matrix.php-version == '8.4' && matrix.mariadb-version == '10.11') && 'pcov' || 'none' }}

    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb-version }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: stardust_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, pdo_mysql
          coverage: ${{ env.COVERAGE }}

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php${{ matrix.php-version }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php-version }}-composer-

      - name: Composer install
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            if mariadb-admin ping -h 127.0.0.1 -P 3307 -uroot -proot --silent 2>/dev/null \
               || mysqladmin ping -h 127.0.0.1 -P 3307 -uroot -proot --silent 2>/dev/null; then
              echo "MariaDB is up"; exit 0
            fi
            sleep 1
          done
          echo "MariaDB did not become ready in time"; exit 1

      - name: Run smoke suite
        env:
          STARDUST_TEST_DSN: "mysql:host=127.0.0.1;port=3307;dbname=stardust_test"
          STARDUST_TEST_USER: "root"
          STARDUST_TEST_PASS: "root"
        run: |
          if [ "$COVERAGE" = "pcov" ]; then
            vendor/bin/phpunit --testsuite Smoke --coverage-clover build/clover.xml
          else
            vendor/bin/phpunit --testsuite Smoke
          fi

      - name: Upload coverage
        if: env.COVERAGE == 'pcov'
        uses: coverallsapp/github-action@v2
        with:
          file: build/clover.xml
          format: clover
          flag-name: mariadb
          parallel: true
          fail-on-error: false

  # Closes the parallel Coveralls build opened by the two uploads above, so
  # the badge reflects both engines merged rather than whichever landed last.
  # always(): a failing smoke cell must not leave the build open forever.
  coverage-finish:
    name: Coverage (merge MySQL + MariaDB)
    needs: [mysql-smoke, mariadb-smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Close parallel Coveralls build
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
          carryforward: "mysql,mariadb"
          fail-on-error: false

  mariadb-rejection:
    name: Smoke against below-floor MariaDB (must fail)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: stardust_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: pdo, pdo_mysql
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Composer install
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            if mariadb-admin ping -h 127.0.0.1 -P 3307 -uroot -proot --silent 2>/dev/null \
               || mysqladmin ping -h 127.0.0.1 -P 3307 -uroot -proot --silent 2>/dev/null; then
              echo "MariaDB is up"; exit 0
            fi
            sleep 1
          done
          echo "MariaDB did not become ready in time"; exit 1

      - name: Smoke suite must reject below-floor MariaDB
        env:
          STARDUST_TEST_DSN: "mysql:host=127.0.0.1;port=3307;dbname=stardust_test"
          STARDUST_TEST_USER: "root"
          STARDUST_TEST_PASS: "root"
        run: |
          if vendor/bin/phpunit --testsuite Smoke; then
            echo "::error::Smoke suite unexpectedly passed against below-floor MariaDB"
            exit 1
          fi
          echo "Smoke suite rejected below-floor MariaDB as expected"
